version: 2.1
orbs:
  node: circleci/node@5.2.0
  cypress: cypress-io/cypress@3.3.0
jobs:
  run-unit-tests:
    executor: node/default
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run frontend tests
          command: npm run test
  install-and-persist:
    executor: cypress/default
    steps:
      - cypress/install
      - persist_to_workspace:
          paths:
            - .cache/Cypress
            - project
          root: ~/
  run-integration-tests:
    executor: cypress/default
    steps:
      - attach_workspace:
          at: ~/
      - cypress/run-tests:
          start-command: npm run dev
          cypress-command: NODE_ENV=production npx nyc cypress run
            
workflows:
  test_frontend_app:
    jobs:
      - run-unit-tests:
          name: Run Unit Tests
      - install-and-persist:
          name: Install & Persist To Workspace
      - run-integration-tests:
          name: Run Integration Tests
          requires:
            - Install & Persist To Workspace
