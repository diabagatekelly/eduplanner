version: 2.1
orbs:
  node: circleci/node@5.1.0
  # heroku: circleci/heroku@1.2.6

jobs:
  test_frontend_and_backend:
    executor: node/default
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          command: npm run test
          name: Run frontend and backend tests
          test-results-for: mocha

  build_and_deploy_backend: # this can be any name you choose
    executor: heroku/default
    steps:
      - attach_workspace:
          at: ~/project
      - heroku/deploy-via-git:
          force: true # force push when pushing to the heroku remote, see: https://devcenter.heroku.com/articles/git

workflows:
  test_my_app:
    jobs:
      - test_frontend_and_backend
      # - build_and_deploy_frontend:
      #     requires:
      #       - test_frontend_and_backend # only deploy if the build_and_test job has completed
      #     filters:
      #       branches:
      #         only: main # only deploy when on main
